{% extends "base.html" %}{% block title %}エラー{% endblock %}
{% block content %}
<div class="banner danger"><span class="icon">⚠</span><div>
  <strong>{% if status_code == 403 %}この操作は行えません{% elif status_code == 404 %}ページが見つかりません{% else %}エラー ({{ status_code }}){% endif %}</strong>
  <p>{{ detail }}</p>
</div></div>
<p><a href="/" class="btn secondary">トップへ戻る</a></p>
{% endblock %}
