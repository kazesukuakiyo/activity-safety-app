[project]
name = "activity-safety-app"
version = "0.1.0"
description = "課外活動安全管理システム (学外活動届)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import 順, UP: 新しい構文, B: よくあるバグ
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI の Depends()/Form() を引数デフォルトに書く流儀と衝突する
    "E501",  # 行長は ruff format に任せる
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
